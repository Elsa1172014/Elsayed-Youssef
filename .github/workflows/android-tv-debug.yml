name: Build Smart Receiver Android TV
on:
  push:
    branches: [feature/universal-smart-tv]
    paths: ['tv/android/**', '.github/workflows/android-tv-debug.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: tv/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-receiver-tv-debug-apk
          path: tv/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
